name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build --target frontend -f deploy/Dockerfile -t sdm-frontend:check .
      - run: docker run --rm sdm-frontend:check pnpm test:graph
  backend:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker compose --profile test build test
      - run: docker compose --profile test run --rm test
      - if: always()
        run: docker compose --profile test down -v
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: >-
          docker run --rm -v "$PWD:/src:ro" zricethezav/gitleaks:v8.24.3
          dir /src --no-banner --redact
